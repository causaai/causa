# -----------------------------------------------------------------------
# Test profile logging configuration
#
# Console output is silenced so ./mvnw test shows only pass/fail lines.
# All log output is written to:  target/test-logs/test.log
# -----------------------------------------------------------------------

# Suppress the startup banner
quarkus.banner.enabled=false

# Turn off console logging entirely
quarkus.log.console.enable=false

# Enable file logging → target/test-logs/test.log
quarkus.log.file.enable=true
quarkus.log.file.path=target/test-logs/test.log
quarkus.log.file.level=ALL
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-backup-index=0
