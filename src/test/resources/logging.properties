# -----------------------------------------------------------------------
# JBoss Log Manager configuration for the test JVM.
#
# All log output is written to:  target/test-logs/test.log
# Nothing is written to the console, so ./mvnw test stays clean.
# -----------------------------------------------------------------------

# Root logger: send everything to the FILE handler only
loggers=

# Root level + handlers
logger.level=ALL
logger.handlers=FILE

# FILE handler — writes to target/test-logs/test.log (wiped before each run by maven-clean-plugin)
handler.FILE=org.jboss.logmanager.handlers.FileHandler
handler.FILE.level=ALL
handler.FILE.formatter=PATTERN
handler.FILE.properties=fileName,append
handler.FILE.fileName=target/test-logs/test.log
handler.FILE.append=false

# Pattern formatter
formatter.PATTERN=org.jboss.logmanager.formatters.PatternFormatter
formatter.PATTERN.properties=pattern
formatter.PATTERN.pattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
