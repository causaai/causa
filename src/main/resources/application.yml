# Causa Backend - Application Configuration
# All properties support runtime ENV variable overrides

# Application Metadata
quarkus:
  application:
    name: ${CAUSA_APP_NAME:causa-backend}
    version: 0.0.1

  # HTTP Server Configuration 
  http:
    port: ${CAUSA_PORT:8080}
    host: ${CAUSA_HOST:0.0.0.0}
    cors:
      enabled: true
      origins: ${CAUSA_CORS_ORIGINS:*}
      methods: ${CAUSA_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      headers: ${CAUSA_CORS_HEADERS:*}

  # OpenAPI/Swagger Configuration 
  smallrye-openapi:
    info-title: Causa Backend API
    info-version: 0.0.1

  # Swagger UI Configuration 
  swagger-ui:
    always-include: false
    path: ${CAUSA_SWAGGER_UI_PATH:/swagger-ui}

  # Logging Configuration
  log:
    level: ${CAUSA_LOG_LEVEL:INFO}
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    category:
      "com.causa":
        level: ${CAUSA_APP_LOG_LEVEL:INFO}
      "org.hibernate.SQL":
        level: WARN
  
  # Console Configuration
  console:
    color: true

  # Banner
  banner:
    enabled: true
    path: banner.txt

  # ============================================================
  # Database Configuration (PostgreSQL + Agroal Connection Pool)
  # ============================================================
  datasource:
    db-kind: postgresql
    username: ${CAUSA_DB_USERNAME:causa_backend}
    password: ${CAUSA_DB_PASSWORD:}
    jdbc:
      url: ${CAUSA_DB_URL:jdbc:postgresql://iri-db-rw:5432/iri-db}
      min-size: ${CAUSA_DB_POOL_MIN_SIZE:2}
      max-size: ${CAUSA_DB_POOL_MAX_SIZE:10}
      idle-removal-interval: ${CAUSA_DB_POOL_IDLE_REMOVAL:PT2M}
      max-lifetime: ${CAUSA_DB_POOL_MAX_LIFETIME:PT10M}
      acquisition-timeout: ${CAUSA_DB_POOL_ACQUISITION_TIMEOUT:PT5S}
      background-validation-interval: ${CAUSA_DB_POOL_VALIDATION_INTERVAL:PT2M}
      new-connection-sql: SELECT 1

  # Flyway Configuration
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

  # Hibernate ORM Configuration
  hibernate-orm:
    # Schema managed exclusively by Flyway — Hibernate must not touch DDL
    database:
      generation: none
    log:
      sql: false
    # Fix for Jackson date serialization compatibility
    mapping:
      format:
        global: ignore
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy



# Custom Application Configuration
causa:
  # Cluster identity — used in Diagnostics API responses
  cluster:
    name: ${CAUSA_CLUSTER_NAME:default}

  # LLM Configuration (LangChain4J)
  llm:
    provider: ${LLM_PROVIDER:vertex-ai-anthropic}
    model-name: ${LLM_MODEL_NAME:}
    base-url: ${LLM_BASE_URL:}
    auth-type: ${LLM_AUTH_TYPE:}
    custom-headers: ${LLM_CUSTOM_HEADERS:{}}
    temperature: ${LLM_TEMPERATURE:0.1}
    max-tokens: ${LLM_MAX_TOKENS:8192}
    api-key: ${LLM_API_KEY:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
    chat-memory-size: ${LLM_CHAT_MEMORY_SIZE:10}
    vertex:
      project-id: ${VERTEX_PROJECT_ID:}
      location: ${VERTEX_LOCATION:}
    bob:
      shell-path: bob

  # Alert Configuration
  alerts:
    filter-severity: ${CAUSA_ALERT_SEVERITY:critical}
    cooldown-minutes: ${CAUSA_ALERT_COOLDOWN:15}
    ignore-namespaces: ${CAUSA_ALERT_IGNORE_NS:kube-system,istio-system}
    cooldown-cleanup-interval: ${CAUSA_ALERT_COOLDOWN_CLEANUP_INTERVAL:5m}

  mcp:
    kubernetes:
      endpoint: ${CAUSA_MCP_K8S_ENDPOINT:http://kubernetes-mcp-server:8080}
      health-path: ${CAUSA_MCP_K8S_HEALTH_PATH:/healthz}
      timeout-ms: ${CAUSA_MCP_K8S_TIMEOUT:5000}
    kruize:
      endpoint: ${CAUSA_MCP_KRUIZE_ENDPOINT:http://kruize-mcp-server-service:8080}
      health-path: ${CAUSA_MCP_KRUIZE_HEALTH_PATH:/q/health/ready}
      timeout-ms: ${CAUSA_MCP_KRUIZE_TIMEOUT:10000}
    cryostat:
      endpoint: ${CAUSA_MCP_CRYOSTAT_ENDPOINT:http://cryostat-mcp:8000}
      health-endpoint: ${CAUSA_MCP_CRYOSTAT_HEALTH_ENDPOINT:http://cryostat-mcp-api:8080}
      health-path: ${CAUSA_MCP_CRYOSTAT_HEALTH_PATH:/healthz}
      timeout-ms: ${CAUSA_MCP_CRYOSTAT_TIMEOUT:15000}
      retry-delay-ms: ${CAUSA_MCP_CRYOSTAT_RETRY_DELAY:5000}
      max-retries: ${CAUSA_MCP_CRYOSTAT_MAX_RETRIES:3}

#   # Feature Flags (Runtime configurable)
#   features:
#     rag-enabled: ${CAUSA_FEATURE_RAG:false}
#     validation-enabled: ${CAUSA_FEATURE_VALIDATION:true}
#     notifications-enabled: ${CAUSA_FEATURE_NOTIFICATIONS:false}

# ============================================================
# Development Profile Configuration
# ============================================================
"%dev":
  quarkus:
    datasource:
      # Dev-only password default to avoid build-time DataSource bean creation failure
      # Production uses Kubernetes secrets via CAUSA_DB_PASSWORD env var
      password: ${CAUSA_DB_PASSWORD:dev_password}
      jdbc:
        url: ${CAUSA_DB_URL:jdbc:postgresql://localhost:5432/iri-db}
  causa:
    # LLM Configuration (LangChain4J)
    llm:
      provider: ${LLM_PROVIDER:vertex-ai-anthropic}
      model-name: ${LLM_MODEL_NAME:claude-sonnet-4-6}
      vertex:
        project-id: ${VERTEX_PROJECT_ID:}
        location: ${VERTEX_LOCATION:us-east5}

