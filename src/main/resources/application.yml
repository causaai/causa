# Causa Backend - Application Configuration
# All properties support runtime ENV variable overrides

# Application Metadata
quarkus:
  application:
    name: ${CAUSA_APP_NAME:causa-backend}
    version: 0.0.1

  # HTTP Server Configuration 
  http:
    port: ${CAUSA_PORT:8080}
    host: ${CAUSA_HOST:0.0.0.0}
    cors:
      ~: true
      origins: ${CAUSA_CORS_ORIGINS:*}
      methods: ${CAUSA_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      headers: ${CAUSA_CORS_HEADERS:*}

  # OpenAPI/Swagger Configuration 
  smallrye-openapi:
    info-title: Causa Backend API
    info-version: 0.0.1

  # Swagger UI Configuration 
  swagger-ui:
    always-include: false
    path: ${CAUSA_SWAGGER_UI_PATH:/swagger-ui}

  # Logging Configuration
  log:
    level: ${CAUSA_LOG_LEVEL:INFO}
    console:
      enable: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      color: true
    category:
      "com.causa":
        level: ${CAUSA_APP_LOG_LEVEL:INFO}

  # Banner
  banner:
    enabled: true
    path: banner.txt

  # ============================================================
  # Database Configuration (PostgreSQL + Agroal Connection Pool)
  # ============================================================
  datasource:
    db-kind: postgresql
    username: ${CAUSA_DB_USERNAME:causa_backend}
    password: ${CAUSA_DB_PASSWORD:}
    jdbc:
      url: ${CAUSA_DB_URL:jdbc:postgresql://diagnostics-tool-db-rw.diagnostics-tool.svc.cluster.local:5432/diagnostics-tool-db}
      min-size: ${CAUSA_DB_POOL_MIN_SIZE:2}
      max-size: ${CAUSA_DB_POOL_MAX_SIZE:10}
      idle-removal-interval: ${CAUSA_DB_POOL_IDLE_REMOVAL:PT2M}
      max-lifetime: ${CAUSA_DB_POOL_MAX_LIFETIME:PT10M}
      acquisition-timeout: ${CAUSA_DB_POOL_ACQUISITION_TIMEOUT:PT5S}
      background-validation-interval: ${CAUSA_DB_POOL_VALIDATION_INTERVAL:PT2M}
      new-connection-sql: SELECT 1

  # Hibernate ORM Configuration
  hibernate-orm:
    database:
      generation: validate
      # Use update to always update the schema on startup in development environments
      # generation: update 
    log:
      sql: true
    # Fix for Jackson date serialization compatibility
    mapping:
      format:
        global: ignore


