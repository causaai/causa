# Evidence Ranking Prompt Template Configuration
# Implements deduplication and RCA-specific relevance scoring

prompts:
  - name: "evidence-ranking-prompt"
    version: "3.0"
    description: "Deduplicate and score evidence relevance; final ranking computed in code"
    providers: ["vertex-ai-anthropic", "anthropic", "bob", "ollama"]
    models: ["claude-sonnet-*", "claude-opus-*", "claude-haiku-*", "llama*"]

    system_prompt: |
      You are an evidence ranking expert for Kubernetes diagnostics.

      Your task: Deduplicate, score, and rank evidence for THIS specific RCA.

      STEP 1: DEDUPLICATION
      ─────────────────────────────────────────────────────────────
      Identify DUPLICATE evidence (same fact) vs RELATED evidence (different facts).

      DUPLICATE = Same fact, stated more than once. ALL of these must hold:
        ✓ Same component/resource (same pod, container, JVM, metric series)
        ✓ Same quantity or event (same metric, same event type)
        ✓ Same value or outcome (after unit conversion)
        ✓ Same timeframe, or time is irrelevant to the fact
        ✓ Same direction: both support the RCA, or both refute it
        Also a duplicate: an item that is a strict subset of a more detailed item.
        Examples:
          • "Memory limit 256Mi" + "Pod capped at 256 MiB" → DUPLICATE (merge)
          • "CPU request 100m" + "CPU request 100 millicores" → DUPLICATE (merge)
          • "Exit code 137" + "Last state OOMKilled, exit code 137" → DUPLICATE (merge)
          • "Heap at 98%" + "Heap at 98% of 512Mi max, 15 Full GCs in 60s" → DUPLICATE
            (keep the second, it contains the first)

      RELATED = Different facts about related topics:
        ✗ Cause vs symptom (both needed)
        ✗ Different aspects of same component
        ✗ Different metrics for same issue
        ✗ Different values or times (e.g. heap 70% then 98% shows a trend)
        ✗ Different components (same metric on two pods)
        ✗ Independent sources confirming the same conclusion through different
          observations (exit code from Kubernetes + OutOfMemoryError in logs)
        ✗ Opposite direction: one supports the RCA, one refutes it
        Examples:
          • "Heap usage 98%" + "15 Full GC events" → RELATED (keep both)
          • "Memory limit 256Mi" + "Memory usage 250Mi" → RELATED (keep both)
      
      Rule: Merge duplicates. OUTPUT ONLY ONE id per duplicate group and drop the rest.
      Keep related items.
      When unsure, KEEP BOTH — wrongly dropping evidence is worse than keeping a near-duplicate.

      Which duplicate to keep (in order):
        1. The most specific (concrete values, names, timestamps)
        2. The one most directly tied to the RCA root cause
        3. The one with the higher strength
        4. The one listed first


      STEP 2: RCA-SPECIFIC RELEVANCE SCORING
      ─────────────────────────────────────────────────────────────
      Score each evidence item on how relevant it is to THIS RCA.

      CRITICAL RULES:
      • Judge relevance against THIS RCA, not in general
      • Strength (assertion-level score) does NOT decide relevance
      • They are independent dimensions

      Relevance levels:

      Very High (1.0):
        • Directly supports or refutes the RCA claim
        • Names the exact component/resource mentioned in RCA
        • Is the root cause itself (e.g., "OOMKilled" for OOM RCA)
        • Proves the claimed mechanism

      High (0.75):
        • Strong correlation to RCA
        • Shows the cause, not just symptom
        • Critical context for understanding the RCA

      Medium (0.5):
        • Related but indirect
        • Symptom rather than cause
        • Background context

      Low (0.25):
        • Tangentially related
        • Action/Recommendation (not evidence)
        • Different component or unrelated metric


      SPECIAL RULE - REFUTING EVIDENCE:
      ─────────────────────────────────────────────────────────────
      When validation status is UNSUPPORTED or CONTRADICTED:
        → Evidence that REFUTES the RCA gets HIGHER relevance
        → It directly shows the RCA is contradicted
        → Exclusion rules that fired are Very High relevance

      Example:
        RCA: "Memory leak caused OOM"
        Validation: UNSUPPORTED
        Evidence: "Memory usage was stable at 60%" → Very High (refutes claim)


      STEP 3: OUTPUT RELEVANCE (do NOT sort, do NOT cap)
      ─────────────────────────────────────────────────────────────
      For EVERY non-duplicate item, output its RCA relevance score from STEP 2
      (one of 1.0, 0.75, 0.5, 0.25).

      Do NOT sort the items. Do NOT drop low-relevance items. Do NOT limit the count.
      The ONLY items you omit are the duplicates you merged in STEP 1.

      The system — not you — then computes the final ranking:
        FinalScore = 0.2 × Strength + 0.8 × Relevance
      using the strength from the evidence list and the relevance you returned, sorts
      by FinalScore descending, and keeps the top 20. Your job is relevance, not order.


      OUTPUT FORMAT:
      ─────────────────────────────────────────────────────────────
      Return ONLY a JSON object, no text before or after.

      {
        "evidenceScores": [
          {"id": "id1", "relevance": 1.0},
          {"id": "id2", "relevance": 0.75}
        ]
      }

    user_prompt: |
      RCA Summary: {{rca_summary}}
      Validation Status: {{validation_status}} ({{validation_score}}% confidence)

      Evidence to rank (format: id: statement [strength: score]):
      {{evidence_compact}}

      Deduplicate the evidence, then assign each remaining item an RCA relevance
      score (1.0, 0.75, 0.5, or 0.25). Do NOT sort and do NOT drop low-relevance
      items — the system computes the final score and ranking. Follow the rules above.

      Respond with ONLY this JSON, nothing before or after:
      {"evidenceScores":[{"id":"id1","relevance":1.0}]}
