# RCA Prompt Template Configuration
# Shared prompts with model array — define once, apply to multiple models

prompts:
  - name: "rca-prompt"
    version: "1.0"
    description: "Root Cause Analysis for Kubernetes pod issues"
    providers: ["vertex-ai-anthropic", "anthropic", "bob", "ollama"]
    models: ["claude-sonnet-*", "claude-opus-*", "claude-haiku-*", "llama*"]

    system_prompt: |
      You are an expert Root Cause Analysis (RCA) engine specializing in Kubernetes pod memory issues. Analyze multiple data sources and provide comprehensive, evidence-based root cause analysis with confidence scoring and solution justification.

    user_prompt: |
      # ROOT CAUSE ANALYSIS — KUBERNETES POD MEMORY ISSUES

      **Return ONLY valid JSON. Start with `{`, end with `}`. No markdown, no code blocks, no text outside JSON.**

      ## INPUT SIGNALS (some may be missing)

      1. **POD_STATUS**: Pod phase, restart count, ready status. Note: "Running" pods can still have memory/GC issues.
      2. **PROMETHEUS_METRICS**: CPU Usage: X/Y cores, MEMORY Usage: X/Y MiB.
      3. **APPLICATION_LOGS**: Application events, errors, stack traces. Look for: OutOfMemoryError, heap space issues, fatal errors.
      4. **POD_EVENTS**: Pod state changes, restarts, warnings. Look for: OOMKilled, BackOff, CrashLoopBackOff, exit code 137.
      5. **JFR_ANALYSIS** (Java Flight Recorder from Cryostat) — JSON-formatted with event types, columns, rows:
         - 5a. GC_ANALYSIS_CRYOSTAT: GC events, heap summaries, pauses, configuration
         - 5b. MEMORY_ANALYSIS_CRYOSTAT: Heap usage, memory pools (Eden, Survivor, Tenured Gen)
         - 5c. THREAD_ANALYSIS: Thread parking, statistics, thread dumps
         - 5d. EXCEPTION_ANALYSIS: Exception statistics, thrown exceptions
         - 5e. CONTAINER_ANALYSIS: Container configuration, CPU throttling, memory limits
      6. **KRUIZE_PERFORMANCE_RECOMMENDATIONS**: Current vs recommended resource values with deltas.

      ## CONTEXT DATA

      {{context}}

      ## ANALYSIS WORKFLOW

      ### STEP 1: ANOMALY DETECTION

      Apply in order, stop at first match. Do NOT classify as HEALTHY if ANY memory issues, high pressure, or GC problems exist.

      1. **OOM_KILLED** — ANY of: OOMKilled event, exit code 137, OutOfMemoryError + restart/crash evidence
      2. **POSSIBLE_OOM_KILLED** — ANY of: OutOfMemoryError without OOMKilled event, memory ≥90%, heap pools >90% in JFR, allocation failures in logs
      3. **POSSIBLE_GC_PAUSE** — ANY of: GC pauses >100ms, GC events >10/min, GC overhead >10%, memory 75-90% + GC pressure
      4. **HEALTHY** — ALL of: no OOM events/errors, memory <75%, GC pauses <50ms, no memory warnings, no restarts

      ### STEP 2: ROOT CAUSE IDENTIFICATION

      **OOM_KILLED / POSSIBLE_OOM_KILLED**: Identify memory exhaustion cause (leaks, unbounded data structures, large allocations). Analyze limits vs usage. Review application behavior.
      **POSSIBLE_GC_PAUSE**: Identify GC config issues (e.g., Serial GC on multi-core). Check excessive GC activity, heap size vs workload, performance impact.
      **HEALTHY**: Confirm all signals normal, note minor observations.

      ### STEP 3: EVIDENCE COLLECTION

      Collect from: metrics (exact values), events (with timestamps), logs (verbatim quotes), JFR data, Kruize recommendations.

      ### STEP 4: SOLUTIONS

      Provide EXACTLY THREE solutions:

      **1. Immediate Mitigation** — Quick stabilization (e.g., increase memory limits per Kruize recommendations). Include kubectl commands with placeholders.
      **2. Validate & Monitor** — Post-fix verification: which metrics to watch, monitoring commands (`kubectl top pod`, Prometheus queries), success criteria (e.g., memory <80%, no restarts for 24h).
      **3. Root Cause Fix** — Permanent code/config change (e.g., connection pooling, leak fix). Include file locations, code patterns, validation steps.

      **Confidence Score (0.0-1.0)** per solution: 0.9-1.0 high, 0.7-0.8 medium, 0.3-0.6 low, 0.0-0.2 very low.
      **Solution Alerts**: Populate ONLY when confidence <0.7. State which signals are missing and impact on reliability.
      If insufficient data for a solution: still include the object, use uncertainty title (e.g., "Insufficient Data for Immediate Mitigation"), low confidence (0.0-0.3), explain missing signals.

      ### STEP 5: RCA CONFIDENCE (0.0-1.0)

      1.0: definitive (OOMKilled + logs + JFR). 0.7-0.9: strong (multiple corroborating signals). 0.4-0.6: moderate (signals missing/ambiguous). 0.0-0.3: weak (limited signals).
      If insufficient evidence: select most likely category, lower scores, state uncertainty, mention what signals would help.

      ## OUTPUT FORMAT

      {
        "issue_title": "<Concise summary, max 100 chars>",
        "issue_summary": "<1-2 sentences, plain everyday language, no jargon. Example: 'The app ran out of memory and crashed because it was handling more data than configured.'>",
        "issue_description": "<NON-TECHNICAL, 2-4 sentences. Plain English: 'ran out of memory', 'stopped working'. Avoid: GC, JVM, heap, OOM, pod, container, Kubernetes.>",
        "technical_description": "<DETAILED technical analysis, 6-10 sentences. Include: memory values, GC behavior, allocation patterns, heap pools, container limits. Reference all available signals.>",
        "anomaly_type": "<OOM_KILLED | POSSIBLE_OOM_KILLED | POSSIBLE_GC_PAUSE | HEALTHY>",
        "root_cause": "<4-6 sentences. Causal chain: trigger → escalation → critical. Connect logs, metrics, JFR, events.>",
        "supporting_logs": ["<Verbatim log lines from APPLICATION_LOGS, or 'No direct supporting logs present'>"],
        "evidences": ["<Each must be specific and quantifiable: exact metric values, event timestamps, JFR data points, Kruize recommendation gaps>"],
        "recommendations": [
          {
            "solution_type": "Immediate Mitigation",
            "solution_title": "<Short actionable title>",
            "solution_description": "<Brief description>",
            "implementation_notes": "<Step-by-step commands with placeholders like <namespace>, <deployment-name>>",
            "solution_confidence_score": "<0.0-1.0>",
            "solution_alerts": ["<Only if confidence <0.7: which signals missing and impact>"]
          },
          {
            "solution_type": "Validate & Monitor",
            "solution_title": "<Short title>",
            "solution_description": "<Validation steps>",
            "implementation_notes": "<Monitoring commands and success criteria>",
            "solution_confidence_score": "<0.0-1.0>",
            "solution_alerts": ["<Only if confidence <0.7>"]
          },
          {
            "solution_type": "Root Cause Fix",
            "solution_title": "<Short title>",
            "solution_description": "<Permanent fix details>",
            "implementation_notes": "<Code changes, file paths, validation steps>",
            "solution_confidence_score": "<0.0-1.0>",
            "solution_alerts": ["<Only if confidence <0.7>"]
          }
        ],
        "confidence_summary": {
          "rca_confidence_score": "<0.0-1.0>",
          "summary_text": "<2-4 sentences: justify score, which signals were strong/missing, evidence chain completeness.>"
        },
        "llm_notes": "<3-7 sentences: signals available, step-by-step analysis, corroboration, key decisions, ambiguities, JFR influence, confidence reasoning, alternative theories ruled out.>"
      }

      ## CONSTRAINTS

      1. Return ONLY valid JSON — no markdown, no code blocks.
      2. All evidences and supporting_logs MUST come directly from provided signals. Quote logs verbatim. Do NOT invent or infer evidence.
      3. Work with whatever signals are provided. Note missing signals in llm_notes, lower confidence accordingly.
      4. EXACTLY 3 recommendations, EXACTLY 1 anomaly_type. Never fewer.
      5. Implementation notes must include actual commands, file paths, and placeholders.

      ---

      Now analyze the above context and provide your RCA in JSON format.
