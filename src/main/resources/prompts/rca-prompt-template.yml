# RCA Prompt Template Configuration
# Shared prompts with model array — define once, apply to multiple models

prompts:
  - models: ["vertex-ai-anthropic", "anthropic", "bob", "ollama"]
    name: "rca-prompt"
    version: "1.0"
    description: "Root Cause Analysis for Kubernetes pod issues"

    system_prompt: |
      You are an expert Root Cause Analysis (RCA) engine for Kubernetes pod memory issues. You MUST respond with ONLY a single valid JSON object. No prose, no markdown, no code fences, no explanatory text — start your response with { and end with }. Any text outside the JSON object will cause a parsing failure.

    user_prompt: |
      **CRITICAL: Return ONLY valid JSON. Start with `{` and end with `}`. No markdown, no code blocks, no explanatory text outside the JSON structure.**

      ## CONTEXT DATA

      {{context}}

      ## ANOMALY CLASSIFICATION

      Classify into EXACTLY ONE (apply in order, stop at first match):

      1. **OOM_KILLED**: OOMKilled event OR exit code 137 OR OutOfMemoryError + restart evidence
      2. **POSSIBLE_OOM_KILLED**: OutOfMemoryError without OOMKilled event, memory ≥90%, heap pools >90%, or allocation failures
      3. **POSSIBLE_GC_PAUSE**: GC pauses >100ms, GC frequency >10/min, GC overhead >10%, or memory 75-90% with GC pressure
      4. **HEALTHY**: ONLY if no OOM/GC issues, memory <75%, no restarts, no memory warnings

      Do NOT classify as HEALTHY if ANY memory issues exist, even if pod is Running.

      ## ANALYSIS STEPS

      1. **Classify** the anomaly using the rules above
      2. **Identify root cause**: For OOM — find what caused memory exhaustion (leaks, unbounded structures, undersized limits). For GC — find configuration issues (wrong GC algorithm, undersized heap)
      3. **Collect evidence**: Use ONLY data present in the provided signals. Quote logs verbatim. Do not invent evidence. If no logs exist, state "No direct supporting logs present"
      4. **Formulate 3 solutions** (see structure below)
      5. **Score confidence** based on signal completeness

      ## SOLUTION REQUIREMENTS

      Provide EXACTLY 3 recommendations:

      1. **Immediate Mitigation**: Quick resource adjustments (e.g., increase memory limits). Include kubectl commands with placeholders.
      2. **Validate & Monitor**: Post-fix monitoring steps. Specify metrics to watch, commands to run, and success criteria (e.g., memory <80%, zero restarts for 24h).
      3. **Root Cause Fix**: Permanent code/config changes. Include specific file locations, code patterns, and validation steps.

      Each solution needs:
      - `solution_confidence_score` (0.0-1.0): 0.9+ strong evidence, 0.7-0.8 incomplete evidence, 0.3-0.6 speculative, <0.3 insufficient data
      - `solution_alerts`: Populate ONLY when confidence <0.7. State which signals are missing and impact on reliability.

      If data is insufficient for a confident solution, still include the object with a descriptive title (e.g., "Insufficient Data for Immediate Mitigation"), explain what's missing, and set low confidence.

      ## OUTPUT JSON

      {
        "issue_title": "<max 100 chars>",
        "issue_summary": "<1-2 sentences, plain language, no jargon — explain to a non-technical person>",
        "issue_description": "<2-4 sentences, non-technical. Use: 'ran out of memory', 'stopped working'. Avoid: GC, JVM, heap, OOM, pod, container>",
        "technical_description": "<6-10 sentences for developers. Include memory values, GC behavior, heap pools, container limits, failure sequence>",
        "anomaly_type": "OOM_KILLED | POSSIBLE_OOM_KILLED | POSSIBLE_GC_PAUSE | HEALTHY",
        "root_cause": "<4-6 sentences. Causal chain: trigger → escalation → failure. Connect logs, metrics, JFR, events>",
        "supporting_logs": ["<verbatim log lines from APPLICATION_LOGS, or 'No direct supporting logs present'>"],
        "evidences": ["<specific, quantifiable evidence from provided signals>"],
        "recommendations": [
          {
            "solution_type": "Immediate Mitigation",
            "solution_title": "<short actionable title>",
            "solution_description": "<what to do and why>",
            "implementation_notes": "<step-by-step commands with placeholders like <namespace>, <pod-name>>",
            "solution_confidence_score": 0.0-1.0,
            "solution_alerts": []
          },
          {
            "solution_type": "Validate & Monitor",
            "solution_title": "<short title>",
            "solution_description": "<what to monitor and success criteria>",
            "implementation_notes": "<monitoring commands and queries>",
            "solution_confidence_score": 0.0-1.0,
            "solution_alerts": []
          },
          {
            "solution_type": "Root Cause Fix",
            "solution_title": "<short title>",
            "solution_description": "<permanent fix details>",
            "implementation_notes": "<code changes, file paths, validation steps>",
            "solution_confidence_score": 0.0-1.0,
            "solution_alerts": []
          }
        ],
        "confidence_summary": {
          "rca_confidence_score": 0.0-1.0,
          "summary_text": "<2-4 sentences: why this confidence level, which signals helped, which were missing>"
        },
        "llm_notes": "<3-7 sentences: analysis narrative, decision points, alternative theories, what was ambiguous>"
      }

      IMPORTANT REMINDER: Your entire response must be a single JSON object. Do not include any text before or after the JSON. Start your response with { and end with }.
