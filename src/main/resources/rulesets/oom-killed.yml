# OOMKilled Rule Set
#
# This rule set validates the OOMKilled hypothesis using signals from
# Kubernetes events, container status, metrics, and logs.
#
# To add a new rule set, simply create a new YAML file in this directory!

hypothesis: OOM_KILLED
name: "OOMKilled Validation Rules"
description: "Deterministic validation rules for OOMKilled hypothesis based on Kubernetes container termination patterns"

# Score thresholds for validation verdict
thresholds:
  minSupportedScore: 10
  minPartiallySupportedScore: 5

# REQUIRED RULES - At least one termination signal must be present
required:
  - id: oom.required.termination_signal
    description: "Container was terminated due to OOM (definitive termination signal)"
    weight: 10
    matchAny:
      - signalType: CONTAINER_STATUS
        signalName: terminationReason
        signalValue: OOMKilled
        condition: EQUALS

      - signalType: CONTAINER_STATUS
        signalName: exitCode
        signalValue: 137
        condition: EQUALS
    messages:
      success: "Valid OOM termination signal detected (OOMKilled or exit code 137)"
      failure: "No OOMKilled termination status or exit code 137 found"

# SUPPORTING RULES - Add positive weight to confidence
supporting:
  - id: oom.supporting.memory_increasing
    description: "Memory utilization continuously increased"
    weight: 3
    match:
      signalType: METRIC
      signalName: memory.utilization.trend
      signalValue: INCREASING
      condition: EQUALS
      matchType: CASE_INSENSITIVE
    messages:
      success: "Found increasing memory trend"
      failure: "No increasing memory trend detected"
  - id: oom.supporting.heap_exceeded
    description: "Heap usage exceeded 90% threshold (ratio: 0.0-1.0 scale)"
    weight: 3
    match:
      signalType: [METRIC, JVM_ANALYSIS]
      signalName: heap.usage.ratio
      condition: GREATER_THAN
      threshold: 0.90
    messages:
      success: "Heap usage exceeded 90%"
      failure: "Heap usage did not exceed threshold"

  - id: oom.supporting.oom_heap_space
    description: "Java heap space OOM error in logs"
    weight: 2
    match:
      signalType: LOG_PATTERN
      signalName: log.message
      signalValue: "Java heap space"
      condition: CONTAINS
    messages:
      success: "Java heap space OOM detected"
      failure: "No Java heap space OOM in logs"

  - id: oom.supporting.oom_direct_buffer
    description: "Direct buffer memory OOM error in logs"
    weight: 2
    match:
      signalType: LOG_PATTERN
      signalName: log.message
      signalValue: "Direct buffer memory"
      condition: CONTAINS
    messages:
      success: "Direct buffer memory OOM detected"
      failure: "No direct buffer OOM in logs"

  - id: oom.supporting.crash_loop
    description: "Pod in CrashLoopBackOff state due to repeated OOM kills"
    weight: 2
    match:
      signalType: POD_STATUS
      signalName: podState
      signalValue: CrashLoopBackOff
      condition: EQUALS
    messages:
      success: "Pod is in CrashLoopBackOff — repeated crash cycle"
      failure: "Pod is not in CrashLoopBackOff"

  - id: oom.supporting.sustained_memory_pressure_ratio
    description: "Memory pressure sustained for majority of pod runtime (>70% of total runtime)"
    weight: 2
    match:
      signalType: METRIC
      signalName: memory.pressure_to_runtime.ratio
      condition: GREATER_THAN
      threshold: 0.70
    messages:
      success: "High memory pressure sustained (>70% of total runtime)"
      failure: "Memory pressure was transitory (<70% of total runtime)"

  - id: oom.supporting.high_restart_count
    description: "High restart count indicates repeated OOM kill cycles"
    weight: 2
    match:
      signalType: METRIC
      signalName: container.restart.count
      condition: GREATER_THAN
      threshold: 3
    messages:
      success: "High restart count detected — chronic OOM condition"
      failure: "Restart count below threshold"

# EXCLUSION RULES - Subtract weight if matched (negative indicators)
exclusion:
  - id: oom.exclusion.manual_restart
    description: "Pod was manually restarted"
    weight: -5
    match:
      signalType: KUBERNETES_EVENT
      signalName: [restart.reason, deletion.reason]
      signalValue: manual
      condition: CONTAINS
      matchType: CASE_INSENSITIVE
    messages:
      success: "Manual restart detected"
      failure: "No manual restart"

  - id: oom.exclusion.deployment_rollout
    description: "Pod terminated due to deployment rollout"
    weight: -10
    match:
      signalType: KUBERNETES_EVENT
      signalName: reason
      signalValue: deployment
      condition: CONTAINS
      matchType: CASE_INSENSITIVE
    messages:
      success: "Deployment rollout restart detected"
      failure: "Not a deployment restart"

  - id: oom.exclusion.node_eviction
    description: "Pod evicted due to node pressure"
    weight: -8
    match:
      signalType: KUBERNETES_EVENT
      signalName: reason
      signalValue: [Evicted, NodePressure]
      condition: EQUALS
    messages:
      success: "Node eviction detected"
      failure: "Not a node eviction"

# Metadata (optional)
metadata:
  version: "1.0.0"
  author: "Causa Team"
  tags: [oom, memory, kubernetes]
  documentation: "https://docs.causa.ai/rules/oom-killed"
