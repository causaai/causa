kind: DatadogAgent
apiVersion: datadoghq.com/v2alpha1

metadata:
  name: datadog
  namespace: openshift-operators

spec:
  global:
    site: us5.datadoghq.com
    clusterName: openshift-cluster

    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key

    kubelet:
      tlsVerify: false

  features:
    prometheusScrape:
      enabled: true
      serviceEndpoints: true

    logCollection:
      enabled: false

    liveProcessCollection:
      enabled: false

    orchestratorExplorer:
      enabled: false

    apm:
      enabled: false

  override:
    nodeAgent:
      hostNetwork: true

      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      tolerations:
        - operator: Exists

