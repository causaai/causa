name: PR Validation - Build Project Without Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile (skip tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile with Maven (skip tests)
        run: mvn clean compile -DskipTests

