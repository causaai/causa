name: Daily Build and Push causa-dev

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push causa-dev Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: mvp_demo

      - name: Get current date (YYYYMMDD)
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build package with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -Dquarkus.container-image.build=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME || secrets.QUAY_ROBOT_NAME || secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD || secrets.QUAY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            quay.io/causaai/causa-dev:${{ steps.date.outputs.date }}
            quay.io/causaai/causa-dev:latest
          labels: |
            quay.expires-after=7d

