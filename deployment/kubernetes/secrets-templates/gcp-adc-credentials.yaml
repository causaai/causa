# Vertex AI ADC Secret Template
#
# This is a TEMPLATE - the script will create the secret using kubectl create.
# DO NOT apply this file directly.
#
# The script detects your ADC file location and creates the secret:
#   kubectl create secret generic gcp-adc-credentials \
#     --from-file=application_default_credentials.json=$HOME/.config/gcloud/application_default_credentials.json \
#     -n openshift-tuning

apiVersion: v1
kind: Secret
metadata:
  name: gcp-adc-credentials
  labels:
    app.kubernetes.io/name: causa-backend
type: Opaque
data:
  application_default_credentials.json: base64-encoded-adc-file
  # Created by script from your local ADC file
