# -------------------------------------------------------
# INSTRUCTIONS:
#
# ⚠️ This secret is ONLY needed for Vertex AI on OpenShift/production.
# For local development, use Application Default Credentials (ADC) instead.
#
# NEVER create this secret manually. Use kubectl create:
#
#   kubectl create secret generic gcp-sa-key \
#     --from-file=key.json=path/to/service-account-key.json \
#     -n diagnostics-tool
#
# To generate the service account key:
#   1. gcloud iam service-accounts keys create sa-key.json \
#        --iam-account=causa-backend@PROJECT_ID.iam.gserviceaccount.com
#   2. kubectl create secret generic gcp-sa-key --from-file=key.json=sa-key.json -n diagnostics-tool
#   3. shred -u sa-key.json  # Delete local copy
#
# Or use the automated script:
#   ./scripts/llm/setup-vertex-ai.sh --env production --project YOUR_PROJECT_ID
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: gcp-sa-key
  namespace: diagnostics-tool
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: secret
type: Opaque
data:
  key.json: "BASE64_ENCODED_SERVICE_ACCOUNT_KEY_JSON"
---
