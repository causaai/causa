# -------------------------------------------------------
# INSTRUCTIONS:
#
# 1. Copy this file to a temporary location
# 2. Replace "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY" with your actual API key from:
#    https://console.anthropic.com/settings/keys
# 3. Apply: kubectl apply -f <your-file>
# 4. DELETE the file with real values immediately
# 5. Never commit real secrets to Git
#
# Example:
#   cp anthropic-secret.yaml /tmp/my-secret.yaml
#   # Edit /tmp/my-secret.yaml
#   kubectl apply -f /tmp/my-secret.yaml
#   rm /tmp/my-secret.yaml
#
# Or use kubectl create (recommended):
#   kubectl create secret generic causa-llm-secrets \
#     --from-literal=LLM_API_KEY=sk-ant-api03-xxxxxxxx \
#     -n diagnostics-tool
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: causa-llm-secrets
  namespace: diagnostics-tool
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY"
---

