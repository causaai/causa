# -------------------------------------------------------
# INSTRUCTIONS:
#
# 1. Copy this file to a temporary location
# 2. Replace "REPLACE_WITH_YOUR_GCP_PROJECT_ID" with your GCP project ID
# 3. Apply: kubectl apply -f <your-file>
# 4. DELETE the file with real values immediately
# 5. Never commit real secrets to Git
#
# Example:
#   cp vertex-ai-secret.yaml /tmp/my-secret.yaml
#   # Edit /tmp/my-secret.yaml
#   kubectl apply -f /tmp/my-secret.yaml
#   rm /tmp/my-secret.yaml
#
# Or use kubectl create (recommended):
#   kubectl create secret generic causa-llm-secrets \
#     --from-literal=VERTEX_PROJECT_ID=your-gcp-project \
#     -n diagnostics-tool
#
# For production, also create GCP service account key secret:
#   kubectl create secret generic gcp-sa-key \
#     --from-file=key.json=path/to/sa-key.json \
#     -n diagnostics-tool
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: causa-llm-secrets
  namespace: diagnostics-tool
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  VERTEX_PROJECT_ID: "REPLACE_WITH_YOUR_GCP_PROJECT_ID"
---
