# -------------------------------------------------------
# ⚠️ SECURITY WARNING ⚠️
# This file contains PLACEHOLDER secrets only.
#
# For production deployments:
# 1. DO NOT commit real secrets to Git
# 2. Use a secret management solution:
#    - Sealed Secrets (Bitnami)
#    - External Secrets Operator
#    - HashiCorp Vault
#    - GCP Secret Manager
#    - AWS Secrets Manager
#
# 3. Or create the secret manually:
#    kubectl create secret generic causa-llm-secrets \
#      --from-literal=LLM_API_KEY=sk-ant-... \
#      --from-literal=VERTEX_PROJECT_ID=my-gcp-project \
#      -n diagnostics-tool
#
# 4. Then remove this file from kustomization.yaml resources
# -------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: causa-llm-secrets
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: config
type: Opaque
stringData:
  # Anthropic Direct API (for LLM_PROVIDER=anthropic)
  # Obtain from: https://console.anthropic.com/settings/keys
  # ⚠️ REPLACE WITH YOUR ACTUAL API KEY BEFORE DEPLOYING
  LLM_API_KEY: "sk-ant-api03-REPLACE_ME"

  CAUSA_DB_USERNAME: "causa_backend"
  CAUSA_DB_PASSWORD: "password_here"

  # NOTE: For Vertex AI (LLM_PROVIDER=vertex-ai-anthropic):
  # Use the automated setup script instead:
  #   ./scripts/llm/setup-vertex-ai.sh --env [local|kind|openshift] --project <GCP_PROJECT_ID>
  # The script will automatically create the required secrets.

  # IBM Bob (for LLM_PROVIDER=ibm-bob) - FUTURE
  # IBM_BOB_API_KEY: "REPLACE_ME"

