apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: causa-backend-pinky
  annotations:
    config.kubernetes.io/description: "Pinky namespace deployment for Causa Backend"

# Deploy to pinky namespace
namespace: pinky

namePrefix: ocp-

commonLabels:
  environment: openshift
  platform: openshift

bases:
  - ../../base

resources:
  - route.yaml

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml

images:
  - name: quay.io/rh-ee-shesaxen/causa-backend
    newName: quay.io/pingupta/irb
    newTag: causa-observability-latest

replicas:
  - name: causa-backend
    count: 2
