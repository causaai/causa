apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-backend
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: causa-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: causa-backend
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      serviceAccountName: causa-backend
      containers:
      - name: causa-backend
        image: quay.io/rh-ee-shesaxen/causa-backend:shekhar_t2
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 9000
          protocol: TCP
        envFrom:
        # Public configuration (non-sensitive)
        # Loads ALL keys from ConfigMap as environment variables
        - configMapRef:
            name: causa-config
        # Secrets (API keys, credentials)
        # Loads ALL keys from Secret as environment variables
        - secretRef:
            name: causa-llm-secrets
            optional: true  # Allow deployment without secrets for non-LLM features
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
