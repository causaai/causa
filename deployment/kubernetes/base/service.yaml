apiVersion: v1
kind: Service
metadata:
  name: causa-backend
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: causa
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/q/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: management
    port: 9000
    targetPort: management
    protocol: TCP
  selector:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: backend
