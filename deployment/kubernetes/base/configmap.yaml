apiVersion: v1
kind: ConfigMap
metadata:
  name: causa-config
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: config
data:
  # Application Configuration
  CAUSA_PORT: "8080"
  CAUSA_LOG_LEVEL: "INFO"

  # Swagger/OpenAPI Configuration
  CAUSA_SWAGGER_UI_PATH: "/swagger-ui"

  # Database Configuration
  CAUSA_DB_URL: "jdbc:postgresql://diagnostics-tool-db-rw.diagnostics-tool.svc.cluster.local:5432/diagnostics-tool-db"

  # LLM Configuration (placeholder)
  # CAUSA_LLM_PROVIDER: "anthropic"
  # CAUSA_LLM_MODEL: "claude-3-5-sonnet-20241022"

  # MCP Configuration (placeholder)
  # CAUSA_MCP_SERVERS: "kruize,cryostat,kubernetes"
