apiVersion: v1
kind: ConfigMap
metadata:
  name: causa-config
  labels:
    app.kubernetes.io/name: causa-backend
data:
  # Application Configuration
  CAUSA_LOG_LEVEL: "INFO"

  # Database Configuration
  CAUSA_DB_URL: "jdbc:postgresql://iri-db-rw.openshift-tuning.svc.cluster.local:5432/iri-db"

  # LLM Configuration (Public settings - non-sensitive)
  # Provider: anthropic (direct API) | vertex-ai-anthropic (Google Cloud) | ibm-bob (future) | ollama (future)
  LLM_PROVIDER: "vertex-ai-anthropic"
  LLM_MODEL_NAME: "claude-sonnet-4-6"
  LLM_TEMPERATURE: "0.1"
  LLM_MAX_TOKENS: "8192"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_CHAT_MEMORY_SIZE: "25"

  # Vertex AI Configuration (Public settings)
  # Valid regions: us-east5, us-central1, europe-west1, asia-southeast1
  # Note: 'global' is NOT valid for Claude on Vertex AI
  VERTEX_LOCATION: "us-east5"

  # Optional overrides (leave empty to use defaults)
  LLM_BASE_URL: ""
  LLM_AUTH_TYPE: ""
  LLM_CUSTOM_HEADERS: ""

  # Alert Configuration
  # Minimum alert severity to trigger diagnostic pipeline (critical, warning, info)
  CAUSA_ALERT_SEVERITY: "critical"

  # Time to wait (minutes) before analyzing repeat alerts for same pod to prevent LLM spam
  CAUSA_ALERT_COOLDOWN: "15"

  # Comma-separated list of namespaces to ignore (e.g., system namespaces)
  CAUSA_ALERT_IGNORE_NS: "kube-system,istio-system"
  # MCP Kubernetes Configuration
  CAUSA_MCP_K8S_ENDPOINT: "http://kubernetes-mcp-server.openshift-tuning.svc.cluster.local:8080"
  CAUSA_MCP_K8S_HEALTH_PATH: "/healthz"
  CAUSA_MCP_K8S_TIMEOUT: "5000"

  # MCP Kruize Configuration (Resource Optimization Recommendations)
  CAUSA_MCP_KRUIZE_ENDPOINT: "http://kruize-mcp-server-service.openshift-tuning.svc.cluster.local:8080"
  CAUSA_MCP_KRUIZE_HEALTH_PATH: "/q/health/ready"
  # Increased timeout: Kruize does internal filtering which can take 15-20 seconds
  CAUSA_MCP_KRUIZE_TIMEOUT: "30000"

  # MCP Cryostat Configuration (JFR-based Java Runtime Analysis)
  CAUSA_MCP_CRYOSTAT_ENDPOINT: "http://cryostat-mcp.openshift-tuning.svc.cluster.local:8000"
  CAUSA_MCP_CRYOSTAT_HEALTH_ENDPOINT: "http://cryostat-mcp-api.openshift-tuning.svc.cluster.local:8080"
  CAUSA_MCP_CRYOSTAT_HEALTH_PATH: "/healthz"
  CAUSA_MCP_CRYOSTAT_TIMEOUT: "15000"
  CAUSA_MCP_CRYOSTAT_RETRY_DELAY: "5000"
  CAUSA_MCP_CRYOSTAT_MAX_RETRIES: "3"

  # Prometheus Configuration (Time-Series Metrics for RCA)
  # Enable/disable Prometheus metrics collection
  CAUSA_PROMETHEUS_ENABLED: "true"

  # HTTP timeout for Prometheus API calls (milliseconds)
  CAUSA_PROMETHEUS_TIMEOUT: "10000"

  # How many hours of historical metrics to collect before alert time
  CAUSA_PROMETHEUS_LOOKBACK_HOURS: "2"

  # Maximum data points per metric (prevents overwhelming LLM)
  CAUSA_PROMETHEUS_MAX_DATA_POINTS: "60"

  # Optional: Override Prometheus URL (leave empty to auto-detect from alert.generatorURL)
  # Internal DNS: http://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091
  # External Route: https://prometheus-k8s-openshift-monitoring.apps.cluster-zzptd.zzptd.sandbox177.opentlc.com
  CAUSA_PROMETHEUS_URL: "http://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091"

