apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: causa-backend-base
  annotations:
    config.kubernetes.io/description: "Base Kubernetes resources for Causa Backend"

namespace: openshift-tuning

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "0.0.1"

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: quay.io/rh-ee-shesaxen/causa-backend
    newTag: latest
