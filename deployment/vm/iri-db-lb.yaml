apiVersion: v1
kind: Service
metadata:
  name: iri-db-external
  namespace: tuning
  annotations:
    # Forces AWS to provision a Network Load Balancer (NLB) instead of a Classic LB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    
    # OPTIONAL: If you only want to allow access from specific external IPs (highly recommended for DBs)
    # service.beta.kubernetes.io/load-balancer-source-ranges: "203.0.113.50/32,198.51.100.0/24"
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    # This targets the active primary pod managed by CNPG
    cnpg.io/cluster: iri-db
    cnpg.io/instanceRole: primary
